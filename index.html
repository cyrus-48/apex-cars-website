<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#efefef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <!-- Runs before paint: enables JS-only motion, applies saved theme, skips preloader on repeat visits. -->
    <script>
      ;(function () {
        var d = document.documentElement
        d.classList.add('js')
        try {
          var t = localStorage.getItem('apex-theme')
          var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) d.classList.add('dark')
          if (sessionStorage.getItem('apex-visited')) d.classList.add('returning')
          else sessionStorage.setItem('apex-visited', '1')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
